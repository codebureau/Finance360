# gitleaks config: the default ruleset plus narrow, documented false-positive allowances.
[extend]
useDefault = true

[[allowlists]]
description = "import-linter module lists in pyproject.toml trip generic-api-key on the word 'api'"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^pyproject\.toml$''']
regexTarget = "line"
regexes = ['''finance360\.(api|mcp|jobs)''']

[[allowlists]]
description = "resolver test calls pass rule_keys=RULE_KEYS (a test constant), which trips generic-api-key on 'keys'"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^backend/tests/.*\.py$''']
regexTarget = "line"
regexes = ['''\brule_keys=RULE_KEYS\b''']

[[allowlists]]
description = "Rule figure keys (e.g. key: \"tax.div293.threshold\") trip generic-api-key on the word 'key'"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''key: "tax\.[a-z0-9_]+(\.[a-z0-9_]+)+"''']

[[allowlists]]
description = "Assumption keys (e.g. key: \"div293_payer\") are short snake_case identifiers that trip generic-api-key on the word 'key'"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''key"?\s*(:|===?)\s*"[a-z][a-z0-9]{0,11}(_[a-z][a-z0-9]{0,11}){1,3}"''']

[[allowlists]]
description = "synthetic owner password in the real-server backup regression test (replaces the history-bound .gitleaksignore fingerprint, which a fresh snapshot would not match)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^backend/tests/test_backup\.py$''']
regexTarget = "line"
regexes = ['''password = "synthetic-owner-pass-1"''']

# --- Personal-identifier shapes (issue #275). Keyword-anchored where a bare number would be noisy. ---

[[rules]]
id = "au-tfn-spaced"
description = "Australian Tax File Number written 3-3-3 with spaces"
regex = '''(?:^|[^\d.,-])(\d{3} \d{3} \d{3})(?:$|[^\d.,-])'''
secretGroup = 1
keywords = [" "]

# An ABN is 11 digits grouped 2-3-3-3, so its last three groups look like a spaced TFN. Not a TFN.
[[rules.allowlists]]
description = "lines naming an ABN (the tail of an 11-digit ABN has the 3-3-3 shape)"
regexTarget = "line"
regexes = ['''(?i)\bABN\b''']

[[rules]]
id = "au-tfn-keyword"
description = "Australian Tax File Number (8-9 digits, optionally spaced) next to a TFN keyword"
regex = '''(?i)\b(?:tfn|tax file (?:number|no))\b[^\n\d]{0,20}(\d{3} ?\d{3} ?\d{2,3})\b'''
secretGroup = 1
keywords = ["tfn", "tax file"]

[[rules]]
id = "au-bsb"
description = "Australian BSB (6 digits, optionally dashed) next to a BSB keyword"
regex = '''(?i)\bbsb\b[^\n\d]{0,20}(\d{3}[- ]?\d{3})\b'''
secretGroup = 1
keywords = ["bsb"]

[[rules]]
id = "au-account-number"
description = "Bank account number (6-10 digits) next to an account/acct keyword"
regex = '''(?i)\b(?:acct|a/c|account|acc)[ _-]?(?:number|no|num|nbr|#)?[\s:=#"'.-]{0,6}(\d{6,10})\b'''
secretGroup = 1
keywords = ["acct", "a/c", "account", "acc"]

[[rules.allowlists]]
description = "obviously invented digit runs used by tests (sequences and zeros)"
regexTarget = "secret"
regexes = ['''^(?:123456\d?|7654321|0+)$''']

[[rules]]
id = "au-member-number"
description = "Super member number (6-12 digits) next to a member keyword"
regex = '''(?i)\bmember[ _-]?(?:number|no|num|nbr|id|#)?[\s:=#"'.-]{0,6}(\d{6,12})\b'''
secretGroup = 1
keywords = ["member"]

[[rules.allowlists]]
description = "obviously invented digit runs used by tests (sequences and zeros)"
regexTarget = "secret"
regexes = ['''^(?:123456\d?|7654321|0+)$''']
