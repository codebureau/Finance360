# Local guards that mirror what CI enforces (AGENTS.md "Contributor setup: pre-commit").
# Install once per clone:  uv tool install pre-commit  then  pre-commit install
# Run on everything:       pre-commit run --all-files
# Both hook types: pre-commit scans the staged diff, commit-msg scans the message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: guard-paths
        name: block private/ and real-export paths
        description: Patterns live in scripts/guard_patterns.txt (single source of truth).
        entry: python scripts/guard_paths.py
        language: python
        # Run on every staged path, whatever its type.
        types: [file]

      - id: guard-denylist
        name: block personal terms (private/denylist.txt)
        description: Added lines only. No denylist locally is a notice, not a failure.
        entry: python scripts/guard_denylist.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: guard-denylist-message
        name: block personal terms in the commit message
        entry: python scripts/guard_denylist.py --text
        language: python
        stages: [commit-msg]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: eslint
        name: eslint (frontend)
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/
        pass_filenames: false
