# Alembic configuration for the CLI (CI's `alembic check`, the review slot, manual use).
# The app itself builds its own Config in finance360.core.migrate and does not read this file.
# The database is FINANCE360_DATA_DIR/finance360.sqlite (see migrations/env.py).
[alembic]
script_location = %(here)s/backend/finance360/migrations
prepend_sys_path = %(here)s/backend
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
