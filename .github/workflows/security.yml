name: Security

# Blocks secrets, personal terms (the private denylist, held as an Actions secret) and real-data paths, on every PR including docs-only ones. A separate workflow
# from ci.yml so the two can evolve independently. Local equivalents: .pre-commit-config.yaml.
# No run on push to main (the PR run is the gate). The weekly run scans full history.
# Dependency audits (pip-audit, npm audit) live in audit.yml and run only when their inputs change.
on:
  pull_request:
    # `edited` so a PR title or body changed after opening is checked against the denylist again.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "0 18 * * 0" # weekly, Monday 04:00/05:00 Australian Eastern
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, so bump it alongside .pre-commit-config.yaml.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${tarball}" gitleaks
      - name: Scan every commit in the PR range
        if: github.event_name == 'pull_request'
        run: >
          ./gitleaks git --redact --verbose
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --redact --verbose

  paths:
    name: private/ and export-pattern guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block real-data paths added or changed by the PR
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | xargs -r -d '\n' python3 scripts/guard_paths.py
      - name: Block real-data paths anywhere in the tree
        if: github.event_name != 'pull_request'
        run: git ls-files -z | xargs -r -0 python3 scripts/guard_paths.py

  denylist:
    name: personal-terms denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The denylist lives only in the FINANCE360_DENYLIST secret. It is written to a temp file
      # without being echoed, and every line is masked in case anything ever prints it. No `set -x`.
      - name: Write the denylist to a temp file
        env:
          DENYLIST: ${{ secrets.FINANCE360_DENYLIST }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set +x
          file="${RUNNER_TEMP}/denylist.txt"
          printf '%s\n' "${DENYLIST}" > "${file}"
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#docs:}"
            if [ -n "${line//[[:space:]]/}" ]; then
              echo "::add-mask::${line}"
            fi
          done < "${file}"
          echo "FINANCE360_DENYLIST=${file}" >> "${GITHUB_ENV}"
          echo "FINANCE360_FORK_PR=${FORK_PR}" >> "${GITHUB_ENV}"
        shell: bash
      - name: Scan lines added by the PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/guard_denylist.py --base "${BASE_SHA}" --head "${HEAD_SHA}"
      - name: Scan the PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_TITLE}" > "${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.txt"
          python3 scripts/guard_denylist.py --text "${RUNNER_TEMP}/pr-title.txt" "${RUNNER_TEMP}/pr-body.txt"
      - name: Scan every tracked file
        if: github.event_name != 'pull_request'
        run: python3 scripts/guard_denylist.py --all
