name: CI

# Step order within each job is the order AGENTS.md documents; keep the two in sync.
# Docs-only changes skip CI (nothing builds or tests Markdown); security.yml still runs on them.
# On a PR, each job runs only when its area changed (the `changes` job). A change to this file,
# a release tag, the weekly run and a manual run each run everything.
# A draft PR runs nothing here: CI runs when it is marked ready and on each push after that.
# The slow tier (tier 2) runs only when the plumbing it exercises changed (`slow` below).
# No run on push to main: the PR run is the gate, and re-running it after every merge roughly
# doubled Actions minutes. The weekly run catches a merge of a PR that was behind main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 0" # weekly, Monday 04:00/05:00 Australian Eastern
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Docker image runs Python 3.14, so CI tests what ships. Keep in step with the Dockerfile. requires-python allows >=3.12.
  UV_PYTHON: "3.14"

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      api: ${{ steps.areas.outputs.api }}
      docker: ${{ steps.areas.outputs.docker }}
      slow: ${{ steps.areas.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # An area runs when a changed file matches its pattern. backend is the exception: it runs
          # when any file falls outside its pattern, i.e. anything but frontend/, docs and Markdown,
          # because the backend tests read scripts/, deploy/, fixtures/ and the compose files.
          # api is what the generated frontend client depends on; docker is what the image copies in.
          # slow is what the slow tier exercises: the database and migrations, the app and API
          # plumbing, the fixture, dependencies, and the slow test files themselves (SLOW_FILES in
          # backend/tests/conftest.py; test_ci_workflow.py keeps the two lists equal).
          declare -A pattern=(
            [backend]='^(frontend/|docs/)|\.md$'
            [frontend]='^frontend/'
            [api]='^(backend/|scripts/export_openapi\.py$|pyproject\.toml$|uv\.lock$)'
            [docker]='^(Dockerfile$|\.dockerignore$|backend/|frontend/|pyproject\.toml$|uv\.lock$|alembic\.ini$)'
            [slow]='^(backend/finance360/(core|api|auth|jobs|migrations|backup|mcp)/|backend/finance360/(main|config)\.py$|backend/tests/(conftest|support)\.py$|backend/tests/test_(ai_concurrency|allowed_hosts|architecture|ask_real_server|auth_concurrency|commit_before_response|document_profiles_real_server|due_real_server|fetch_api|fetch_real_server|imports_commit_real_server|opening_real_server|imports_real_server|library_real_server|reference_real_server|rule_figures_real_server|scenarios_real_server|scheduler_fetch|super_statements_real_server|tax_real_server|upgrade_populated)\.py$|fixtures/|pyproject\.toml$|uv\.lock$|alembic\.ini$)'
          )
          if [ -z "$BASE" ]; then
            files=""; all=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            all=$(grep -qx '.github/workflows/ci.yml' <<<"$files" && echo true || echo false)
            echo "Changed files:"; echo "$files"
          fi
          for area in "${!pattern[@]}"; do
            if [ "$all" = true ]; then hit=true
            elif [ "$area" = backend ]; then
              hit=$(grep -qvE "${pattern[$area]}" <<<"$files" && echo true || echo false)
            else
              hit=$(grep -qE "${pattern[$area]}" <<<"$files" && echo true || echo false)
            fi
            echo "$area=$hit" | tee -a "$GITHUB_OUTPUT"
          done

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests (tier 1)
        run: uv run pytest -m "not slow and not platform"
      - name: Slow tests (tier 2; tier 3 is platform.yml)
        if: needs.changes.outputs.slow == 'true'
        run: uv run pytest -m slow
      - name: Boundaries
        run: uv run lint-imports
      - name: Alembic up-to-date (migrations match the models)
        env:
          FINANCE360_DATA_DIR: ${{ runner.temp }}/alembic-check
        run: |
          uv run alembic upgrade head
          uv run alembic check

  # Runs when frontend/ changed, or when the API it is generated from changed (drift check only).
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Python + uv are needed only to export the OpenAPI schema for the drift check.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        if: needs.changes.outputs.frontend == 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
      - name: Tests
        if: needs.changes.outputs.frontend == 'true'
        run: npm test
      - name: API client drift
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::Generated API client is stale. Run 'npm run generate:api' in frontend/ and commit the result."
            exit 1
          }

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t finance360:ci .
