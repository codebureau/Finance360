[project]
name = "finance360"
version = "0.0.0"
license = "AGPL-3.0-or-later"
description = "Personal-first household wealth-planning platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic==2.6.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "jsonschema>=4.26.0",
    "pdfminer.six==20260107",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.0",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.30",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.170.0",
    "import-linter>=2.15",
    "playwright>=1.64.0",
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/finance360"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Test tiers (AGENTS.md): a bare `pytest` runs tier 1. CI runs `-m "not platform"` (tiers 1 and 2);
# platform.yml runs `-m platform` (tier 3). A later -m on the command line replaces this one.
addopts = '-m "not slow and not platform"'
markers = [
    "slow: tier 2, real-server, concurrency and populated-upgrade tests (CI on every PR)",
    "platform: tier 3, backup and restore with real restic and rclone (platform.yml, Linux)",
]

[tool.ruff]
line-length = 100
src = ["backend"]
# ruff also formats code fences in Markdown; ADR snippets are illustrative prose, not code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.isort]
known-first-party = ["finance360", "support"]  # backend/tests/support.py

[tool.ruff.lint.per-file-ignores]
# S105/S106: test passwords are invented placeholders by rule (AGENTS.md rule 1).
"backend/tests/**" = ["S101", "S105", "S106"]
# S603/S607: the guard shells out to git (fixed argv, no shell); its tests do the same to a temp repo.
"scripts/guard_denylist.py" = ["S603", "S607"]
"backend/tests/test_guard_denylist.py" = ["S101", "S105", "S106", "S603", "S607"]
"backend/tests/test_guard_paths.py" = ["S101", "S105", "S106", "S603", "S607"]
# Written by scripts/rulepack_update.py: a provisional note is one string on one line.
"backend/finance360/rulepacks/au/tax_figures.py" = ["E501"]

[tool.pyright]
include = ["backend", "scripts", "deploy"]
strict = ["backend/finance360"]
extraPaths = ["backend", "backend/tests"]

# Architecture boundaries (ADR-0004, ADR-0009 section 7). Run: uv run lint-imports
[tool.importlinter]
root_package = "finance360"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Dependency direction: entry points > plugins > capabilities > core"
type = "layers"
containers = ["finance360"]
layers = ["api | mcp | jobs", "plugins", "capabilities", "core"]

[[tool.importlinter.contracts]]
name = "API, MCP and jobs reach domain logic only through the service layer"
type = "forbidden"
source_modules = ["finance360.api", "finance360.mcp", "finance360.jobs"]
forbidden_modules = ["finance360.plugins", "finance360.behaviours", "finance360.rulepacks"]

[[tool.importlinter.contracts]]
name = "Entry points do not depend on each other"
type = "independence"
modules = ["finance360.api", "finance360.mcp", "finance360.jobs"]

